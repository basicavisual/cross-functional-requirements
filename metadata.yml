---
name: Cross-Functional Requirements
abstract: |
  The cross-functional requirements define the shared behaviour and constraints that all Building Blocks must satisfy - security, deployment, observability, data handling and so on. A Building Block specification inherits all of these rules and then adds its own functional requirements, API contracts and domain-specific logic on top. It can tighten or elaborate inherited rules where allowed, but it cannot contradict or weaken them.
